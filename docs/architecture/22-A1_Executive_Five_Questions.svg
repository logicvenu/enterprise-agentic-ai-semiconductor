<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050"><rect width="1600" height="1050" fill="white"/><text x="800" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700">22-A1 — Executive Opening: The Five Questions</text><rect x="120" y="90" width="1360" height="145" rx="22" fill="#D6EAF8" stroke="#5D6D7E" stroke-width="2"/><text x="800" y="128" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">1. WHY?</text><text x="800" y="168" text-anchor="middle" font-family="Arial" font-size="21">Why does the organization need an Enterprise AI Platform?</text><text x="800" y="202" text-anchor="middle" font-family="Arial" font-size="18">Engineering productivity → faster workflows → potential Time-to-Silicon impact</text><text x="800" y="258" text-anchor="middle" font-family="Arial" font-size="28">↓</text><rect x="120" y="275" width="1360" height="145" rx="22" fill="#E8DAEF" stroke="#5D6D7E" stroke-width="2"/><text x="800" y="313" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">2. WHAT?</text><text x="800" y="353" text-anchor="middle" font-family="Arial" font-size="21">What platform are we building?</text><text x="800" y="387" text-anchor="middle" font-family="Arial" font-size="18">Reusable semiconductor Enterprise AI Platform — Pattern 2 Hybrid</text><text x="800" y="443" text-anchor="middle" font-family="Arial" font-size="28">↓</text><rect x="120" y="460" width="1360" height="145" rx="22" fill="#E8F8F5" stroke="#5D6D7E" stroke-width="2"/><text x="800" y="498" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">3. HOW?</text><text x="800" y="538" text-anchor="middle" font-family="Arial" font-size="21">How does the Hybrid AI Platform work?</text><text x="800" y="572" text-anchor="middle" font-family="Arial" font-size="18">Applications → Abstraction → Models / Knowledge / Tools → AWS / Private / Air-Gapped</text><text x="800" y="628" text-anchor="middle" font-family="Arial" font-size="28">↓</text><rect x="120" y="645" width="1360" height="145" rx="22" fill="#FDEBD0" stroke="#5D6D7E" stroke-width="2"/><text x="800" y="683" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">4. WHY THIS ARCHITECTURE?</text><text x="800" y="723" text-anchor="middle" font-family="Arial" font-size="21">Why these boundaries, abstractions and controls?</text><text x="800" y="757" text-anchor="middle" font-family="Arial" font-size="18">Decoupling + workload placement + IP protection + governance + human control</text><text x="800" y="813" text-anchor="middle" font-family="Arial" font-size="28">↓</text><rect x="120" y="830" width="1360" height="145" rx="22" fill="#D5F5E3" stroke="#5D6D7E" stroke-width="2"/><text x="800" y="868" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700">5. WHAT VALUE?</text><text x="800" y="908" text-anchor="middle" font-family="Arial" font-size="21">How does it improve engineering productivity and contribute to Time-to-Silicon?</text><text x="800" y="942" text-anchor="middle" font-family="Arial" font-size="18">Workflow improvement → productivity → cycle-time reduction → measured business contribution</text></svg>
